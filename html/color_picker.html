<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Colour picker shown inside the import dialog when "Custom..." colours
     are selected. Talks to AltiumImporter.py through Fusion's
     adsk.fusionSendData / fusionJavaScriptHandler bridge. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font: 11px "Segoe UI", Arial, sans-serif; color: #444;
    user-select: none; -webkit-user-select: none; }
  .wrap { padding: 2px 4px 4px; }
  .targets { display: flex; gap: 6px; margin-bottom: 6px; }
  .target { flex: 1; display: flex; align-items: center; gap: 6px; padding: 3px 6px;
    border: 1px solid #c8c8c8; border-radius: 4px; background: #fff; cursor: pointer; }
  .target.on { border-color: #0696d7; box-shadow: 0 0 0 1px #0696d7; }
  .target .chip { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
  .target .lbl { line-height: 1.1; }
  .target .hex { font-family: Consolas, monospace; color: #777; }
  .sv { position: relative; height: 84px; border-radius: 4px; cursor: crosshair;
    border: 1px solid rgba(0,0,0,.2); }
  .sv .w, .sv .b { position: absolute; inset: 0; border-radius: 3px; }
  .sv .w { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sv .b { background: linear-gradient(to top, #000, rgba(0,0,0,0)); }
  .ring { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; }
  .hue { position: relative; height: 12px; margin-top: 6px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(0,0,0,.2);
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .hue .knob { position: absolute; top: -2px; width: 6px; height: 14px; margin-left: -3px;
    border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 6px; }
  .sw { flex: 1; max-width: 30px; height: 18px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25);
    cursor: pointer; }
  .sw:hover { transform: scale(1.12); }
  .board { display: block; width: 100%; height: 118px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="targets">
    <div class="target on" id="t-mask" data-k="mask">
      <div class="chip"></div><div class="lbl">Mask<br><span class="hex"></span></div>
    </div>
    <div class="target" id="t-silk" data-k="silk">
      <div class="chip"></div><div class="lbl">Silkscreen<br><span class="hex"></span></div>
    </div>
  </div>
  <div class="sv" id="sv"><div class="w"></div><div class="b"></div><div class="ring" id="ring"></div></div>
  <div class="hue" id="hue"><div class="knob" id="knob"></div></div>
  <div class="row" id="swatches"></div>
  <svg class="board" id="board" viewBox="0 0 280 112" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script>
(function () {
  var SWATCH = {
    mask: ["#1A6B2D", "#0E4D24", "#111111", "#F2F2F2", "#A3161A", "#123C8C", "#4B1E6E", "#D9B300"],
    silk: ["#FFFFFF", "#F5F5F0", "#BDBDBD", "#111111", "#E8D44D", "#F2A900", "#C8102E", "#1E5AA8"]
  };
  var col = { mask: "#1A6B2D", silk: "#F5F5F0" };
  var cur = "mask";
  var hsv = [0, 0, 0];

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function hexToRgb(h) {
    h = String(h || "").replace("#", "");
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function rgbToHex(c) {
    return "#" + c.map(function (v) { return ("0" + Math.round(v).toString(16)).slice(-2); }).join("").toUpperCase();
  }
  function rgbToHsv(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return [h, mx ? d / mx : 0, mx];
  }
  function hsvToRgb(h, s, v) {
    var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }

  // ---- preview board (SVG, built once; paint() recolours it) ----
  // Laid out on a 280 x 112 grid with no part, pad, via or label touching
  // another (tests/check_picker_layout.js verifies this).
  var GOLD = "#D4AF37", HOLE = "#2B2B2B";
  function svgBoard() {
    var o = [];
    function el(t, a) { var s = "<" + t; for (var k in a) s += " " + k + '="' + a[k] + '"'; o.push(s + "/>"); }
    function txt(x, y, t, sz, anchor) {
      o.push('<text class="sf" data-k="text" x="' + x + '" y="' + y + '" font-size="' + (sz || 8) +
             '" font-family="Arial, sans-serif" font-weight="bold" text-anchor="' + (anchor || "middle") +
             '">' + t + "</text>");
    }
    function pad(x, y, w, h) { el("rect", { "data-k": "pad", x: x, y: y, width: w, height: h, fill: GOLD }); }
    function outline(x, y, w, h, sw) {
      el("rect", { "class": "ss", "data-k": "silk", x: x, y: y, width: w, height: h, fill: "none", "stroke-width": sw || 1 });
    }
    function chip0805(x, y, label) {          // silk box 24 x 12 at x,y, label above
      outline(x, y, 24, 12);
      pad(x + 3, y + 2, 6, 8); pad(x + 15, y + 2, 6, 8);
      txt(x + 12, y - 3, label);
    }
    el("rect", { "class": "m", x: 1, y: 1, width: 278, height: 110, rx: 8, stroke: "rgba(0,0,0,.35)", "stroke-width": 1 });
    // copper traces under the mask: mask colour, lightened
    ["M98 34 H66 L64 36 H61",           // U1 -> R12
     "M98 60 H70 L66 66 H61",           // U1 -> C3
     "M43 36 H31", "M43 66 H31",        // R12 / C3 -> vias
     "M144 34 H158 L164 40 H170",       // U1 -> Q2
     "M144 60 H158 L165 67 H170",       // U1 -> R7
     "M188 67 H229.5",                  // R7 -> J1 pin 4
     "M179 27 V18 H214 L224 28 H229.5", // Q2 -> J1 pin 1
     "M108 70 V90 H89", "M134 70 V90 H151", // U1 -> vias
     "M127.5 24 V15 H149",              // U1 -> via
     "M235 86 V96 H213"                 // J1 pin 5 -> via
    ].forEach(function (d) {
      var a = { "class": "tm", "data-k": "trace", d: d, fill: "none", "stroke-width": 3,
                "stroke-linecap": "round", "stroke-linejoin": "round" };
      el("path", a);
      el("path", { d: d, fill: "none", stroke: "rgba(255,255,255,.16)", "stroke-width": 3,
                   "stroke-linecap": "round", "stroke-linejoin": "round" });
    });
    // U1: QFP-20, body 104..138 x 30..64
    outline(104, 30, 34, 34, 1.2);
    el("circle", { "class": "sf", cx: 109, cy: 35, r: 1.6 });
    for (var i = 0; i < 5; i++) {
      var q = 4 + i * 6.5;
      pad(104 + q - 1.3, 24, 2.6, 5); pad(104 + q - 1.3, 65, 2.6, 5);
      pad(98, 30 + q - 1.3, 5, 2.6); pad(139, 30 + q - 1.3, 5, 2.6);
    }
    txt(121, 50, "U1", 9);
    chip0805(40, 30, "R12");
    chip0805(40, 60, "C3");
    chip0805(167, 61, "R7");
    // Q2: SOT-23, body 167..191 x 33..47, label to the right
    outline(167, 33, 24, 14);
    pad(170, 35, 5, 10);                 // pin 1 (left)
    pad(183, 35, 5, 10);                 // pin 2 (right)
    pad(176.5, 27, 5, 5);                // pin 3 (top)
    txt(200, 43, "Q2");
    // J1: 1x5 header, pins at x 235, y 30..80
    outline(226, 22, 18, 66, 1.2);
    for (var j = 0; j < 5; j++) {
      var cy = 30 + j * 12.5;
      if (j === 0) el("rect", { "data-k": "pad", x: 229.5, y: cy - 5.5, width: 11, height: 11, fill: GOLD });
      else el("circle", { "data-k": "pad", cx: 235, cy: cy, r: 5.5, fill: GOLD });
      el("circle", { cx: 235, cy: cy, r: 2.4, fill: HOLE });
    }
    txt(235, 17, "J1");
    // vias (tented) and mounting holes
    [[28, 36], [28, 66], [86, 90], [154, 90], [152, 15], [210, 96]].forEach(function (v) {
      el("circle", { "data-k": "via", cx: v[0], cy: v[1], r: 3, fill: "rgba(255,255,255,.16)" });
      el("circle", { cx: v[0], cy: v[1], r: 1.2, fill: HOLE });
    });
    [[12, 12], [268, 12], [12, 100], [268, 100]].forEach(function (h) {
      el("circle", { "data-k": "hole", cx: h[0], cy: h[1], r: 6, fill: GOLD });
      el("circle", { cx: h[0], cy: h[1], r: 3.6, fill: HOLE });
    });
    txt(121, 105, "ALTIUM IMPORTER  REV A", 7);
    return o.join("");
  }
  document.getElementById("board").innerHTML = svgBoard();

  var sv = document.getElementById("sv"), ring = document.getElementById("ring");
  var hue = document.getElementById("hue"), knob = document.getElementById("knob");
  var board = document.getElementById("board"), row = document.getElementById("swatches");

  function paint() {
    ["mask", "silk"].forEach(function (k) {
      var t = document.getElementById("t-" + k);
      t.className = "target" + (k === cur ? " on" : "");
      t.querySelector(".chip").style.background = col[k];
      t.querySelector(".hex").textContent = col[k];
    });
    sv.style.background = rgbToHex(hsvToRgb(hsv[0] % 360, 1, 1));
    ring.style.left = (hsv[1] * 100) + "%";
    ring.style.top = ((1 - hsv[2]) * 100) + "%";
    knob.style.left = (hsv[0] / 360 * 100) + "%";
    function each(sel, fn) { Array.prototype.forEach.call(board.querySelectorAll(sel), fn); }
    each(".m", function (e) { e.setAttribute("fill", col.mask); });
    each(".tm", function (e) { e.setAttribute("stroke", col.mask); });
    each(".ss", function (e) { e.setAttribute("stroke", col.silk); });
    each(".sf", function (e) { e.setAttribute("fill", col.silk); });
    Array.prototype.forEach.call(row.querySelectorAll(".sw"), function (e, i) {
      e.style.background = SWATCH[cur][i];
      e.title = SWATCH[cur][i];
    });
  }
  function load(k) { cur = k; var c = hexToRgb(col[k]); if (c) hsv = rgbToHsv(c); paint(); }

  var timer = null;
  function send() {
    // throttle while dragging; Fusion only needs the latest value
    if (timer) return;
    timer = setTimeout(function () {
      timer = null;
      if (window.adsk && adsk.fusionSendData)
        adsk.fusionSendData("colors", JSON.stringify(col));
    }, 60);
  }
  function setFromHsv() { col[cur] = rgbToHex(hsvToRgb(hsv[0] % 360, hsv[1], hsv[2])); paint(); send(); }

  function drag(el, fn) {
    function at(e) { var r = el.getBoundingClientRect();
      fn(clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)); }
    el.addEventListener("mousedown", function (e) {
      at(e);
      function mv(ev) { at(ev); }
      function up() { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); }
      document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
      e.preventDefault();
    });
  }
  drag(sv, function (x, y) { hsv[1] = x; hsv[2] = 1 - y; setFromHsv(); });
  drag(hue, function (x) { hsv[0] = x * 359.9; setFromHsv(); });

  for (var i = 0; i < SWATCH.mask.length; i++) {
    var d = document.createElement("div");
    d.className = "sw";
    d.addEventListener("click", function (e) {
      var idx = Array.prototype.indexOf.call(row.querySelectorAll(".sw"), e.currentTarget);
      col[cur] = SWATCH[cur][idx]; load(cur); send();
    });
    row.appendChild(d);
  }
  ["mask", "silk"].forEach(function (k) {
    document.getElementById("t-" + k).addEventListener("click", function () { load(k); });
  });

  function apply(data) {
    try {
      var d = typeof data === "string" ? JSON.parse(data) : data;
      if (!d) return;
      if (hexToRgb(d.mask)) col.mask = d.mask.toUpperCase();
      if (hexToRgb(d.silk)) col.silk = d.silk.toUpperCase();
      load(cur);
    } catch (e) { /* ignore malformed data */ }
  }
  // Python -> page (initial colours, and edits typed in the hex boxes)
  window.fusionJavaScriptHandler = {
    handle: function (action, data) {
      if (action === "set") apply(data);
      return "OK";
    }
  };
  // Fusion injects adsk.fusionSendData shortly after load; ask for the
  // current colours once it is there.
  var tries = 0;
  (function ready() {
    if (window.adsk && adsk.fusionSendData) {
      var r = adsk.fusionSendData("ready", "");
      if (r && r.then) r.then(apply); else if (r) apply(r);
    } else if (tries++ < 50) setTimeout(ready, 100);
  })();
  window.__picker = { apply: apply, get: function () { return col; } };   // for tests
  load("mask");
})();
</script>
</body>
</html>
